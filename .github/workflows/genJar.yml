name: Spider Jar Gen CI (Simplified)

on:
  push:
    branches: [ "Catvod" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Custom Spider Jar
        run: ./gradlew app:buildCustomSpiderJar

      # --- 提交到当前仓库 ---
      - name: Add & Commit to Current Repository
        uses: EndBug/add-and-commit@v9.1.4
        with:
          default_author: github_actions
          message: 'update spider jar and json'
          add: "['./jar/custom_spider.jar', './jar/custom_spider.jar.md5','./json/index.json']"

      # --- 新增：推送到目标仓库 https://github.com/yilishawk/js.git ---
      - name: Push Jar to yilishawk/js Repository
        env:
          TARGET_PAT: ${{ secrets.TARGET_PAT }}   # 推荐使用 Secrets 方式
        run: |
          echo "Preparing to push to target repository..."

          # 创建临时目录并克隆目标仓库
          mkdir -p target_repo
          cd target_repo
          git clone https://x-access-token:${TARGET_PAT}@github.com/yilishawk/js.git .
          
          # 复制需要推送的文件
          cp ../jar/custom_spider.jar ./ 2>/dev/null || echo "Warning: custom_spider.jar not found"
          cp ../jar/custom_spider.jar.md5 ./ 2>/dev/null || echo "Warning: md5 file not found"
          cp ../json/index.json ./ 2>/dev/null || echo "Warning: index.json not found"
          
          # 提交并推送
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          git add -A
          git commit -m "Update spider jar and json from build" || echo "No changes to commit"
          git push origin main || git push origin master
        continue-on-error: true   # 如果没有变化也不失败

      # --- 保留原来的 Artifact 下载 ---
      - name: Find Jar path
        id: find_jar
        run: |
          JAR_PATH="./jar/custom_spider.jar"
          if [ -f "$JAR_PATH" ]; then
            echo "JAR_PATH=$JAR_PATH" >> $GITHUB_OUTPUT
          else
            BUILT_JAR=$(find . -path "*/app/build/libs/custom_spider.jar" -type f -print | head -n 1)
            if [ -n "$BUILT_JAR" ]; then
                echo "Found built jar at: $BUILT_JAR"
                echo "JAR_PATH=$BUILT_JAR" >> $GITHUB_OUTPUT
            else
                echo "::error::Jar file not found after build."
                exit 1
            fi
          fi

      - name: Upload Jar Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Spider-Jar
          path: ${{ steps.find_jar.outputs.JAR_PATH }}
          retention-days: 7
