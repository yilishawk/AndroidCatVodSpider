name: Spider Jar Gen CI (Simplified)

on:
  push:
    branches: [ "multiThread" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21.0.5+11'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Custom Spider Jar
        # ⚠️ 注意：这个命令依赖于您在 app/build.gradle 中注册了 buildCustomSpiderJar 任务！
        # 如果该任务不存在，您需要将其改为：./gradlew app:shadowJar
        run: ./gradlew app:buildCustomSpiderJar
        
      # --- 保留 Jar 包和 JSON 文件提交到仓库的步骤 ---
      - name: Add & Commit Jar and JSON
        uses: EndBug/add-and-commit@v9.1.4
        with:
          default_author: github_actions
          message: 'update spider jar and json'
          add: "['./jar/custom_spider.jar', './jar/custom_spider.jar.md5','./json/index.json']"

      # --- 新增：将生成的 Jar 包保存为 Artifacts 供下载 ---
      - name: Find Jar path
        id: find_jar
        # 查找您期望的 Jar 包路径
        run: |
          JAR_PATH="./jar/custom_spider.jar"
          if [ -f "$JAR_PATH" ]; then
            echo "JAR_PATH=$JAR_PATH" >> $GITHUB_OUTPUT
          else
            echo "::warning::Jar file not found at expected path: $JAR_PATH. Checking build output..."
            # 备用查找路径，以防 buildCustomSpiderJar 任务输出到默认位置 (app/build/libs)
            BUILT_JAR=$(find . -path "*/app/build/libs/custom_spider.jar" -type f -print | head -n 1)
            if [ -n "$BUILT_JAR" ]; then
                echo "Found built jar at: $BUILT_JAR"
                echo "JAR_PATH=$BUILT_JAR" >> $GITHUB_OUTPUT
            else
                echo "::error::Jar file not found after build."
                exit 1
            fi
          fi
          
      - name: Upload Jar Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Spider-Jar
          path: ${{ steps.find_jar.outputs.JAR_PATH }}
          retention-days: 7
