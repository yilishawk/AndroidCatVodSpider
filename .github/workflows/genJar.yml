name: Spider Jar Gen CI (Simplified)

on:
  push:
    branches:
      - "multiThread"
      - "Catvod"          # 新增 Catvod 分支触发
    # 关键：本工作流自己提交的产物不再触发下一轮，切断"构建->提交->再构建"的自触发循环
    paths-ignore:
      - 'jar/custom_spider.jar'
      - 'jar/custom_spider.jar.md5'
      - 'json/index.json'
  workflow_dispatch:

# 关键：同一分支的构建串行执行。避免两次构建同时往回提交，
# 导致 GitHub Pages 报 "Deployment request failed ... due to in progress deployment"
concurrency:
  group: jar-ci-${{ github.ref }}
  cancel-in-progress: false

# add-and-commit 需要写权限；不显式声明时若仓库默认是只读 token 会直接失败
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4
        with:
          # add-and-commit 需要完整历史，浅克隆偶尔会报 couldn't find remote ref
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Custom Spider Jar
        run: ./gradlew app:buildCustomSpiderJar --no-daemon

      # 构建后立刻校验产物，缺文件就在这里报错，不要等到后面提交时才发现
      - name: Verify jar and json exist
        run: |
          missing=0
          for f in ./jar/custom_spider.jar ./jar/custom_spider.jar.md5 ./json/index.json; do
            if [ -f "$f" ]; then
              echo "OK   $f  $(wc -c < "$f") bytes"
            else
              echo "::error::构建后缺少 $f"
              missing=1
            fi
          done
          exit $missing

      # --- 提交到当前仓库 ---
      - name: Add & Commit to Current Repository
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: 'update spider jar and json'
          add: "['./jar/custom_spider.jar', './jar/custom_spider.jar.md5','./json/index.json']"

      # --- 推送到目标仓库，带分支标识 ---
      - name: Push Jar to yilishawk/js Repository
        env:
          TARGET_PAT: ${{ secrets.TARGET_PAT }}
        run: |
          set -e
          if [ -z "$TARGET_PAT" ]; then
            echo "::warning::TARGET_PAT 未配置，跳过推送到 js 仓库"
            exit 0
          fi

          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Current branch: $BRANCH_NAME"

          mkdir -p target_repo
          cd target_repo
          git clone "https://x-access-token:${TARGET_PAT}@github.com/yilishawk/js.git" .

          # 目标仓库默认分支可能是 main 也可能是 master，动态取，不要硬编码
          DEF_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Target default branch: $DEF_BRANCH"

          TARGET_DIR="spider/${BRANCH_NAME}"
          mkdir -p "$TARGET_DIR"

          cp ../jar/custom_spider.jar "$TARGET_DIR/" 2>/dev/null || echo "::warning::custom_spider.jar not found"
          cp ../jar/custom_spider.jar.md5 "$TARGET_DIR/" 2>/dev/null || echo "::warning::md5 not found"
          cp ../json/index.json "$TARGET_DIR/" 2>/dev/null || echo "::warning::index.json not found"

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "目标仓库内容无变化，跳过提交"
            exit 0
          fi

          git commit -m "Update spider jar and json from ${BRANCH_NAME} branch"
          git push origin "$DEF_BRANCH"
        continue-on-error: true

      - name: Upload Jar Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Spider-Jar-${{ github.ref_name }}
          path: ./jar/custom_spider.jar
          retention-days: 7
